<!doctype html>
<html lang="es-MX">
  <head>
    <script>
      (function () {
        var p = new URLSearchParams(location.search);
        var h = location.hash || "";
        var cb =
          p.has("code") ||
          p.has("error") ||
          p.has("error_description") ||
          h.indexOf("access_token") !== -1 ||
          /(?:^|[&#])error(?:_description)?=/.test(h);
        if (location.pathname !== "/cuenta" && cb) {
          location.replace("/cuenta" + location.search + location.hash);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Metas SEO por ruta: las inyecta Seo.tsx (react-helmet-async). -->
    <title>Vargas Tacos</title>
    <link
      rel="preload"
      href="/fonts/fugaz-one-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/nunito-sans-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      href="/hero_cel.webp"
      type="image/webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/hero.webp"
      type="image/webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.webp" type="image/webp" sizes="32x32" />
    <link rel="icon" href="/favicon-48.webp" type="image/webp" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1E1710" />
  </head>
  <body>
    <!--
      THESIS: A cream-paper morning taquería as a food magazine, not a QSR clone and not a charcoal flyer.
      OWN-WORLD: Paper field, Fugaz One display, chile-red CTAs with cream type, gold specialty chips.
      STORY: Visitor reads the cover line, browses the menu, opens a taco, pays in person.
      FIRST VIEWPORT: Full-bleed plancha, slogan del flyer con “sabor” en terracotta, logo en el header, dos acciones.
      FORM: User rejected Kalnia as too common; Fugaz One for main titles; hero copy is the flyer slogan rewritten as a pitch.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
